# /games (see "location ~ ^/games/?$"): which page of games, from ?page= (anything that isn't a page number is page 1,
# as in the app); whether the API's text goes in (not for a search or a filter); and noindex for those.
map $arg_page $games_page {
  "~^0*(?<n>[1-9][0-9]{0,4})$" $n;
  "~^0*[1-9][0-9]{5,}$" 100000;  # far past the last page: the API says so, and it's a 404
  default 1;
}
map "$arg_q$arg_category$arg_rating$arg_sort" $games_ssr {
  "" yes;
  default no;
}
map $games_ssr $games_robots {
  no "noindex";
  default "";
}
# Page 2 onwards (no search or filter) is checked with the API first: a page past the last one is a 404.
map "$games_ssr$games_page" $games_check {
  yes1 "";
  "~^yes" 1;
  default "";
}
# /creators the same way: its page, its text unless it is a search (?q=), and page 2 onwards checked with the API.
map $arg_page $creators_page {
  "~^0*(?<n>[1-9][0-9]{0,4})$" $n;
  "~^0*[1-9][0-9]{5,}$" 100000;  # far past the last page: the API says so, and it's a 404
  default 1;
}
map $arg_q $creators_ssr {
  "" yes;
  default no;
}
map $creators_ssr $creators_robots {
  no "noindex";
  default "";
}
map "$creators_ssr$creators_page" $creators_check {
  yes1 "";
  "~^yes" 1;
  default "";
}
# /leaderboard: all time, or this week (?period=week), as in the app.
map $arg_period $leaderboard_period {
  week week;
  default all;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # proxy_pass below uses a variable, so nginx looks the API up itself (and again every minute).
  resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
  resolver_timeout 3s;

  # Smaller downloads: the JavaScript, CSS and text files go out gzipped (HTML always does).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain application/xml;

  # Pages are checked with the server on every visit (a cheap 304 when unchanged), so a new deploy shows
  # at once; the files below are cached hard.
  add_header Cache-Control "no-cache";

  # The app's pages (keep in step with src/main.tsx).
  # The homepage is home.html (see vite.config.ts): index.html with the API's text for search engines and AI tools
  # put inside #root by an SSI include (startng-be app/routers/pages.py, home_page). The app replaces that text when
  # it loads. The scripts come from this file, so they always match the live site. If the API can't answer, the
  # include is empty and the page is the plain app.
  location = / {
    ssi on;
    ssi_silent_errors on;
    try_files /home.html /index.html =404;
  }
  location = /_ssr/home {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_set_header Accept-Encoding "";  # ask for plain text: SSI pastes the answer as it is, so a compressed one would show as garbage
    proxy_pass $ssr/pages/home;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @ssr_empty;
  }
  location @ssr_empty {
    if ($request_uri ~ "^/_ssr/") { return 404; }  # asked for directly, not by the include
    default_type text/html;
    return 200 "";
  }
  location = /connect {
    try_files /index.html =404;
  }
  # Each page has its own HTML file with its own title and link-preview tags (see vite.config.ts). The Hangout's also has
  # a few lines about it inside #root, written at build time, for search engines (the page itself is a 3D park).
  location = /hangout {
    try_files /hangout.html =404;
  }
  location ~ ^/admin/?$ {  # admins only: the API checks every request
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location ~ ^/about/?$ {  # about.html has the page written into it at build time (see vite.config.ts)
    try_files /about.html =404;
  }
  location ~ ^/docs/?$ {  # the docs are in docs.html itself, written at build time (see vite.config.ts)
    try_files /docs.html =404;
  }
  # Every game, 20 a page (?page=2), searchable (?q=) and filtered (?category= ...). Like the homepage, games.html
  # includes the API's text for that page inside #root (startng-be app/routers/pages.py, games_page), and each page
  # is its own canonical address. Searches and filters get no text and are kept out of search results.
  location ~ ^/games/?$ {
    if ($games_check) { rewrite ^ /_games_page last; }
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $games_robots always;
    try_files /games.html =404;
  }
  # /games?page=2 and on: the same page, once the API says that page has games. Past the last page it's the site's
  # 404 page with a 404 status (the app shows "Page not found" there too). If the API can't answer, the page is served.
  location = /_games_page {
    internal;
    auth_request /_ssr/games_check;
    error_page 403 404 =404 /404.html;
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    try_files /games.html =404;
  }
  location = /_ssr/games_check {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/games?page=$games_page;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 = @games_missing;
    error_page 422 500 502 503 504 = @games_unknown;
  }
  location @games_missing {
    if ($request_uri ~ "^/_ssr/") { return 404; }  # asked for directly, not by auth_request
    return 403;  # auth_request's "no": the page above turns it into the 404 page
  }
  location @games_unknown {
    return 204;  # the API didn't answer: serve the page anyway
  }
  location = /_ssr/games {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_set_header Accept-Encoding "";  # ask for plain text: SSI pastes the answer as it is, so a compressed one would show as garbage
    proxy_pass $ssr/pages/games?$args;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 422 500 502 503 504 = @ssr_empty;
  }
  # Every game by independent creators, 20 a page (?page=2) and searchable (?q=): the same as /games above, with the API's
  # text from /pages/creators (startng-be app/routers/pages.py, creators_page).
  location ~ ^/creators/?$ {
    if ($creators_check) { rewrite ^ /_creators_page last; }
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $creators_robots always;
    try_files /creators.html =404;
  }
  location = /_creators_page {
    internal;
    auth_request /_ssr/creators_check;
    error_page 403 404 =404 /404.html;
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    try_files /creators.html =404;
  }
  location = /_ssr/creators_check {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/creators?page=$creators_page;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 = @games_missing;
    error_page 422 500 502 503 504 = @games_unknown;
  }
  location = /_ssr/creators {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_set_header Accept-Encoding "";  # ask for plain text: SSI pastes the answer as it is, so a compressed one would show as garbage
    proxy_pass $ssr/pages/creators?$args;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 422 500 502 503 504 = @ssr_empty;
  }
  location ~ ^/emails/?$ {  # choose your emails; where confirm and unsubscribe links land (H1)
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  # Today's tournament and the overall leaderboard (all time, or ?period=week: this week, its own address), with the
  # API's text inside #root like the homepage (startng-be app/routers/pages.py, tournament_page and leaderboard_page).
  location ~ ^/tournament/?$ {
    ssi on;
    ssi_silent_errors on;
    try_files /tournament.html =404;
  }
  location = /_ssr/tournament {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_set_header Accept-Encoding "";  # ask for plain text: SSI pastes the answer as it is, so a compressed one would show as garbage
    proxy_pass $ssr/pages/tournament;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 422 500 502 503 504 = @ssr_empty;
  }
  location ~ ^/leaderboard/?$ {
    ssi on;
    ssi_silent_errors on;
    try_files /leaderboard.html =404;
  }
  location = /_ssr/leaderboard {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_set_header Accept-Encoding "";  # ask for plain text: SSI pastes the answer as it is, so a compressed one would show as garbage
    proxy_pass $ssr/pages/leaderboard?$args;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 422 500 502 503 504 = @ssr_empty;
  }
  # One game's page, /games/<name>: asked of the API, which sends back the website's HTML with that game's title,
  # description and preview image already in it (so search engines and shared links see them). The address of
  # the API is SSR_UPSTREAM, set when the container starts (see the Dockerfile). If the API can't be reached
  # the plain page is served instead, and the app fills it in; an unknown game is the site's 404 page.
  location ~ "^/games/(?<game_name>[a-z0-9][a-z0-9-]{0,39})/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/games/$game_name;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @game_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  # A game's own pages (a feature, see startng-be app/features/game_pages): /games/<name>/about, /how-to-play, /faq and /walkthrough.
  # The API writes the whole page and React does not start on it (src/main.tsx). A page that is not approved is a real 404
  # (the site's 404 page, noindex); if the API can't be reached, the plain page is served and main.tsx sends the visitor to the game's page.
  location ~ "^/games/(?<sub_game>[a-z0-9][a-z0-9-]{0,39})/(?<sub_kind>about|how-to-play|faq|walkthrough)/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/games/$sub_game/$sub_kind;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    # 404 is in the list too, so deploying nginx before the backend is safe (the route doesn't exist there yet). It goes to
    # the site's own 404 page and keeps the 404 status (no "="), so a missing or unapproved page is still a real 404 and noindex.
    error_page 404 /404.html;
    error_page 500 502 503 504 = @game_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  # A game by an independent creator, /creators/<id>-<name>: the same, from the API.
  location ~ "^/creators/(?<indie_id>[0-9]{1,10})(-[a-z0-9-]*)?/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/creators/$indie_id;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @game_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  # The About and FAQ pages of a game by an independent creator (a feature, see startng-be app/features/game_pages/indie.py): the same.
  location ~ "^/creators/(?<indie_sub_id>[0-9]{1,10})(-[a-z0-9-]*)?/(?<indie_sub_kind>about|faq)/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/creators/$indie_sub_id/$indie_sub_kind;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    # 404 is in the list too, so deploying nginx before the backend is safe. It goes to the site's own 404 page and keeps
    # the 404 status (no "="), so a missing page is still a real 404 and noindex.
    error_page 404 /404.html;
    error_page 500 502 503 504 = @game_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  location @game_shell {
    try_files /game.html =404;
  }

  # Player pages (a feature, see src/features/profiles): /p/<username> (older links: /p/<id>-<name>), and /me for your own
  location ~ "^/p/[A-Za-z0-9_-]{1,40}/?$" {
    try_files /profile.html =404;
  }
  location ~ ^/me/?$ {
    try_files /profile.html =404;
  }

  # The text of a feature's page for search engines, from the API (/pages/spotlight ... in startng-be): spotlight.html, creators-board.html,
  # shop.html and friends-tournaments.html include it inside #root (see vite.config.ts). Empty while the feature is off or the API can't answer.
  location ~ "^/_ssr/feature/(?<ssr_page>spotlight|by|shop|friends)$" {
    internal;
    set $ssr "${SSR_UPSTREAM}";
    proxy_set_header Accept-Encoding "";  # ask for plain text: SSI pastes the answer as it is, so a compressed one would show as garbage
    proxy_pass $ssr/pages/$ssr_page;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 404 422 500 502 503 504 = @ssr_empty;
  }

  # Spotlight (a feature, see src/features/spotlight): the Game of the Week and the daily challenge
  location ~ ^/spotlight/?$ {
    ssi on;
    ssi_silent_errors on;
    try_files /spotlight.html =404;
  }

  # Creators (a feature, see src/features/creator_hub): /by is the top creators, /by/<id>-<name> a creator's page, asked of the
  # API for the tags (their name and card) that search engines and shared links read. If the API can't answer, the plain page.
  location ~ ^/by/?$ {
    ssi on;
    ssi_silent_errors on;
    try_files /creators-board.html =404;
  }
  location ~ "^/by/(?<creator_id>[0-9]{1,10})(-[A-Za-z0-9_-]*)?/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/by/$creator_id/page;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @creator_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  location @creator_shell {
    try_files /creator.html =404;
  }

  # Approve links for games published through the API: /approve/<code>
  location ~ "^/approve/[A-Za-z0-9_-]{8,40}/?$" {  # quoted: nginx needs quotes around a { in a pattern
    try_files /approve.html =404;
  }
  # Categories (a feature, see startng-be app/features/tags): /categories lists them, /categories/<slug> is one category's games.
  # The API writes the whole page and React does not start on it (src/main.tsx). A category that has no page yet is a real 404
  # (the site's 404 page, noindex); if the API can't be reached, the plain page is served and main.tsx sends the visitor to /games.
  location ~ ^/categories/?$ {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/categories;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    # 404 is in the list too, so deploying nginx before the backend is safe (the route doesn't exist there yet). It goes to
    # the site's own 404 page and keeps the 404 status (no "="), so a missing or unapproved page is still a real 404 and noindex.
    error_page 404 /404.html;
    error_page 500 502 503 504 = @game_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  location ~ "^/categories/(?<cat_slug>[a-z0-9][a-z0-9-]{0,39})/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/categories/$cat_slug$is_args$args;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    # 404 is in the list too, so deploying nginx before the backend is safe (the route doesn't exist there yet). It goes to
    # the site's own 404 page and keeps the 404 status (no "="), so a missing or unapproved page is still a real 404 and noindex.
    error_page 404 /404.html;
    error_page 500 502 503 504 = @game_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  # Tournaments with friends (a feature, see src/features/private_tournaments): /friends starts one, /friends/<code> is an invite link
  location ~ ^/friends/?$ {
    ssi on;
    ssi_silent_errors on;
    try_files /friends-tournaments.html =404;
  }
  # An invite link asked of the API, which sends back the website's HTML with the tournament's name and card already in it
  # (what a chat shows when the link is pasted). If the API can't answer, or the feature is off, the plain page is served.
  location ~ "^/friends/(?<friend_code>[A-Za-z0-9_-]{8,16})/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/private-tournaments/$friend_code/page;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @friends_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  location @friends_shell {
    try_files /private-tournament.html =404;
  }
  # Friends & follows (a feature, see src/features/follows): /follows is your lists and invite link, /f/<code> an invite
  location ~ ^/follows/?$ {
    try_files /follows.html =404;
  }
  location ~ "^/f/[A-Za-z0-9_-]{8,16}/?$" {
    try_files /friend-invite.html =404;
  }
  # Leagues (a feature, see src/features/leagues): your group, tier and countdown
  location ~ ^/league/?$ {
    try_files /league.html =404;
  }
  # Wardrobe (a feature, see src/features/wardrobe): your coins and items, and the daily shop
  location ~ ^/wardrobe/?$ {
    try_files /wardrobe.html =404;
  }
  location ~ ^/shop/?$ {
    ssi on;
    ssi_silent_errors on;
    try_files /shop.html =404;
  }

  # A shared card, /s/<kind>/<id> (a feature, see src/features/share_cards): asked of the API, which sends back the
  # website's HTML with the card in its preview tags. If the API can't answer, or the feature is off, the plain app is
  # served and sends people on to what was shared.
  location ~ "^/s/(?<share_kind>[a-z_]{1,32})/(?<share_id>[A-Za-z0-9_-]{1,64})/?$" {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/share/$share_kind/$share_id/page;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @share_shell;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  location @share_shell {
    try_files /index.html =404;
  }
  # A challenge link, /c/<code> (a feature, see src/features/challenges). Shared as /s/challenge/<code>, which carries
  # the card; this page is the app itself, kept out of search engines.
  location ~ "^/c/[A-Za-z0-9_-]{8,16}/?$" {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  # The docs as plain text, for AI tools: readable in the browser, not a download.
  location = /docs.md {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    try_files $uri =404;
  }

  # Plain-text summaries for AI tools and answer engines (llms.txt, aeo.txt): readable in the browser, as UTF-8.
  location ~ ^/(llms|aeo)\.txt$ {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Built files have a fingerprint in their name (a new build is a new name), so browsers keep them for a year.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Pictures and the favicon change rarely: a week.
  location ~* \.(svg|jpg|jpeg|png|webp|ico)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # For search engines. The sitemap comes from the API (it lists every game); the one built with the
  # site, which has only the fixed pages, is the fallback.
  location = /robots.txt {
    try_files $uri =404;
  }
  location = /sitemap.xml {
    set $ssr "${SSR_UPSTREAM}";
    proxy_pass $ssr/pages/sitemap.xml;
    proxy_ssl_server_name on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @sitemap_static;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600";
  }
  location @sitemap_static {
    default_type application/xml;
    try_files /sitemap.static.xml =404;
  }

  # Real files (built assets, favicon). Anything else is a 404 ...
  location / {
    try_files $uri =404;
  }

  # ... answered with the app, which shows its "Page not found" screen, keeping the 404 status.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
